<!doctype html>
<html lang="zh-CN">
    <meta charset="utf-8" /><meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    /><title>ShotForm · 篮球游戏 SVG</title
    ><style>
        * {
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            margin: 0;
            background: #f3eee6;
            color: #1c2128;
            font:
                15px/1.6 "Microsoft YaHei",
                sans-serif;
        }
        header,
        main {
            max-width: 1800px;
            margin: auto;
            padding: 32px;
        }
        h1 {
            font-size: 32px;
            margin: 0 0 8px;
        }
        p {
            color: #526071;
            margin: 8px 0;
        }
        a {
            color: #344f76;
        }
        nav {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        h2 {
            font-size: 22px;
            margin: 0 0 12px;
        }
        section {
            margin: 0 0 48px;
            scroll-margin-top: 20px;
        }
        .pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        figure {
            margin: 0;
            min-width: 0;
        }
        figcaption {
            margin-bottom: 8px;
            color: #526071;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid #d6d3cd;
            border-radius: 8px;
        }
        .live {
            display: inline-block;
            padding: 10px 18px;
            background: #4f678c;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 16px;
        }
        a:focus-visible {
            outline: 3px solid #4f678c;
            outline-offset: 4px;
        }
        footer {
            padding: 0 32px 32px;
            color: #526071;
        }
        @media (max-width: 850px) {
            .pair {
                grid-template-columns: 1fr;
            }
            header,
            main {
                padding: 20px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }
        }
    </style>
    <header>
        <h1>篮球游戏 · SVG 界面</h1>
        <p>立体按钮、原创篮球图标与球场插画。浅深主题同屏对比，点击截图查看原尺寸。</p>
        <p>这些是实际页面截图；分析结论、角度与历史记录使用测试示例，不代表模型实测。</p>
        <a class="live" href="/">打开可操作界面</a>
